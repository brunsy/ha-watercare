
# Minimal set of integrations for developing/testing the watercare
# custom component. default_config: was replaced because it also
# loads usb/bluetooth/go2rtc, which fail to set up in this devcontainer.
config:
history:
logbook:
recorder:
system_health:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
