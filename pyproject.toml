[project]
name = "ha-watercare"
# Placeholder: the real version lives in custom_components/watercare/manifest.json
# (stamped by the release workflow), as do the integration's runtime
# requirements. This project only describes the development environment.
version = "0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
lint = ["ruff==0.15.21"]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aioresponses==0.7.9",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "colorlog==6.10.1",
    "homeassistant==2026.6.4",
    # homeassistant's own package metadata doesn't declare these, but the
    # frontend/cloud integrations are always loaded (see bootstrap.py
    # DEFAULT_INTEGRATIONS) and HA does not auto-install requirements for
    # "system" type integrations at runtime -- so installing homeassistant
    # alone leaves them missing. Versions pinned to what this homeassistant
    # release's own manifests require.
    "home-assistant-frontend==20260527.7",
    "numpy==2.3.2",
    "av==16.0.1",
    "PyTurboJPEG==1.8.3",
    "rf-protocols==4.0.1",
    "ha-ffmpeg==3.2.2",
    "infrared-protocols==5.6.1",
    "aiohasupervisor==0.4.3",
    "hassil==3.7.0",
    "home-assistant-intents==2026.6.1",
    "mutagen==1.47.0",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "openai==2.21.0",
]

[tool.uv]
# Not an installable package: Home Assistant loads custom_components/
# directly, and tests import it via pytest's pythonpath setting below.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
