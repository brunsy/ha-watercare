backfill_history:
  name: Backfill history
  description: >-
    Re-run the one-time deep import of halfhourly usage history (as far back
    as the Watercare API allows, roughly the last 3 years). Only adds
    statistics for hours after the most recently recorded one -- if regular
    polling has already run and advanced past the point you want backfilled,
    re-running this won't fill in older gaps until the existing
    watercare:halfhourly_* statistics are cleared first (Developer tools >
    Statistics).
